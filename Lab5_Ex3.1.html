<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trang trình bày infographic Canva và video YouTube.">
  <title>Infographic và video</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    header {
      padding: 3rem 1.25rem 2.5rem;
      color: #fff;
      text-align: center;
      background: linear-gradient(135deg, #4338ca, #7c3aed);
    }

    header h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 5vw, 3rem);
    }

    header p {
      max-width: 42rem;
      margin: 0 auto;
      color: #e0e7ff;
      line-height: 1.6;
    }

    main {
      width: min(100% - 2rem, 960px);
      margin: 2rem auto 3rem;
    }

    section {
      margin-bottom: 1.5rem;
      padding: clamp(1rem, 3vw, 1.75rem);
      overflow: hidden;
      background: #fff;
      border: 1px solid #e5eaf3;
      border-radius: 1rem;
      box-shadow: 0 12px 32px rgb(31 41 55 / 7%);
    }

    h2 {
      margin: 0 0 1rem;
      font-size: 1.4rem;
    }

    .embed {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #eef2ff;
      border-radius: 0.65rem;
    }

    .infographic {
      aspect-ratio: 16 / 9;
    }

    .video {
      aspect-ratio: 16 / 9;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .fallback {
      margin: 0.9rem 0 0;
      color: #526078;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    a {
      color: #4338ca;
    }

    a:focus-visible {
      outline: 3px solid #a5b4fc;
      outline-offset: 3px;
    }

    footer {
      padding: 1.5rem;
      color: #64748b;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Infographic và video</h1>
    <p>Cùng khám phá nội dung qua infographic và video được trình bày trên một trang.</p>
  </header>

  <main>
    <section aria-labelledby="infographic-heading">
      <h2 id="infographic-heading">Infographic</h2>
      <div class="embed infographic">
        <iframe
          src="https://www.canva.com/design/DAHXWHpRpns/BEDS6JgRUxPC4QfzoG0DIA/view?embed"
          title="Infographic trên Canva"
          loading="lazy"
          allowfullscreen>
        </iframe>
      </div>
      <p class="fallback">
        Nếu infographic không hiển thị,
        <a href="https://canva.link/3o3vyl6qwxntwpi" target="_blank" rel="noopener noreferrer">mở thiết kế trên Canva</a>.
      </p>
    </section>

    <section aria-labelledby="video-heading">
      <h2 id="video-heading">Video YouTube</h2>
      <div class="embed video">
        <iframe
          src="https://www.youtube-nocookie.com/embed/gSEVZ3QNFu8"
          title="Video YouTube"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>
      <p class="fallback">
        <a href="https://youtu.be/gSEVZ3QNFu8?si=5vyjzRckyxlmaoIE" target="_blank" rel="noopener noreferrer">Xem video trực tiếp trên YouTube</a>.
      </p>
    </section>
  </main>

  <footer>Infographic và video được nhúng từ Canva và YouTube.</footer>
</body>
</html>
